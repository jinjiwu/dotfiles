# [general]
set -g mouse on # 开启鼠标
set -g history-limit 40000 # 滚动缓冲区大小
# setw -g mode-keys vi # 开启vi风格后，支持vi的C-d、C-u、hjkl等快捷键

# [keymap] (prefix+{ or prefix+})
bind -r '{' swap-window -t -1 \; select-window -t -1
bind -r '}' swap-window -t +1 \; select-window -t +1
bind n new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
# [keymap.modern] 使用更现代的快捷键绑定
bind [ previous-window
bind ] next-window
bind = split-window -hc "#{pane_current_path}"
bind - kill-pane
bind Up    select-pane -U
bind Down  select-pane -D
bind Left  select-pane -L
bind Right select-pane -R

# [status] 状态栏设置
set -g status-position bottom # 状态栏位置 (top or bottom)
set -g status-justify left    # 状态栏内容对齐方式 (left, centre, right)
set -g status-style bg=colour235,fg=colour136
set -g status-interval 1      # 状态栏刷新间隔 (秒)

# [status.left] 左边状态栏
set -g status-left-length 50
# 逻辑：Session名为黄色，计时器为淡灰色，全部使用方括号包裹
# set -g status-left "#[fg=colour220][#S] #[fg=colour244]#(ps -o etime= -p $(pgrep -P #{pane_pid} -n) 2>/dev/null | awk '{if($1) print \"[\"$1\"] \"}')#[default]"
set -g status-left "#[fg=colour220][#S] "
# [status.right] 右边状态栏
set -g status-right-length 150
# set -g status-right "#{?client_prefix,#[bg=blue]#[fg=white] ^B #[default] ,}#[fg=colour220]#{s|$HOME|~|:pane_current_path}#[fg=colour245]|#[fg=cyan]%Y-%m-%d#[fg=colour245] #[fg=magenta]%H:%M#[default] "
set -g status-right "#{?client_prefix,#[bg=blue]#[fg=white] ^B #[default] ,}#[fg=colour220]#{s|$HOME|~|:pane_current_path}#[fg=colour245]|#[fg=cyan]%y%m%d#[fg=colour245] #[fg=magenta]%H:%M#[default] "

# [status.window] 窗口状态样式
# 普通窗口 (未激活)：使用 Base01 灰色 (colour244)，低调不抢眼
setw -g window-status-format "#[fg=colour244]#I:#W#F"
# 当前窗口 (激活)：使用 Orange 橙色 (colour166)，这是 Solarized 的经典高亮色
setw -g window-status-current-format "#[fg=colour166,bold]#I:#W#F"
# 活动面板边框颜色
set -g pane-active-border-style fg=colour220 # 黄色
# 非活动面板边框颜色
set -g pane-border-style fg=colour238 # 深灰色
# 消息栏样式 (例如重新加载配置时的提示)
set -g message-style fg=colour220 # yellow on dark grey

# [plugin]
# [plugin.tpm] tmux plugin manager
# tmux source ~/.tmux.conf or `ctrl+b r` to reload tmux config
# `ctrl+b I` to install plugins 
# or `ctrl+b U` to update plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# [plugin.tmux-continuum.settings] 让continuum 在 tmux 启动时自动恢复会话
set -g @continuum-restore 'on'

# 初始化 tmux 插件管理器 (tpm)
run '~/.tmux/plugins/tpm/tpm'
