set -g mouse on # 开启鼠标
set -g history-limit 40000 # 滚动缓冲区大小
# setw -g mode-keys vi # 开启vi风格后，支持vi的C-d、C-u、hjkl等快捷键

# 移动窗口快捷键 (prefix+{ or prefix+})
bind -r '{' swap-window -t -1 \; select-window -t -1
bind -r '}' swap-window -t +1 \; select-window -t +1
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -hc "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# 状态栏设置
set -g status-position bottom # 状态栏位置 (top or bottom)
set -g status-justify left    # 状态栏内容对齐方式 (left, centre, right)
# 透明优先：继承终端默认背景；前景也用默认值，适配 light/dark
set -g status-style bg=default,fg=default
set -g status-interval 1      # 状态栏刷新间隔 (秒)

set -g status-left-length 50
# 逻辑：Session名为黄色，计时器为淡灰色，全部使用方括号包裹
set -g status-left "#{?client_prefix,#[fg=colour160]#[bold]#[underscore],#[fg=default]#[bold]}[#S] #[default]"

# 右边状态栏
set -g status-right-length 150
set -g status-right "#[fg=colour39]#{s|$HOME|~|:pane_current_path}#[fg=colour37]#(ps -o etime= -p $(pgrep -P #{pane_pid} -n) 2>/dev/null | awk 'NF{print \" [\"$1\"]\"; exit}')#[default] "

# 普通窗口 (未激活)：使用 Base01 灰色 (colour244)，低调不抢眼
setw -g window-status-format "#[fg=colour245]#I:#W#F#[default]"

# 当前窗口 (激活)：仅使用前景色和加粗，不使用背景
setw -g window-status-current-format "#[fg=colour39,bold]#I:#W#F#[default]"
# 活动面板边框颜色
set -g pane-active-border-style fg=colour220 # 黄色
# 非活动面板边框颜色
set -g pane-border-style fg=colour238 # 深灰色

# 消息栏样式 (例如重新加载配置时的提示)
set -g message-style bg=default,fg=default

# 加载 tmux-resurrect 插件
# type this in terminal if tmux is already running
# tmux source ~/.tmux.conf
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 让 continuum 在 tmux 启动时自动恢复会话
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
