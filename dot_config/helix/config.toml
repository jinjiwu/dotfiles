theme = "catppuccin_mocha"

[editor]
line-number = "relative"
cursorline = true
bufferline = "always"

[editor.cursor-shape]
insert = "bar" 
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
character = "╎"

[editor.soft-wrap]
enable = true
wrap-indicator = ""
