# [general]
save-position-on-quit
# 播放结束后不关闭窗口 (方便看最后一帧或重新播放)
keep-open=yes
# 启动时窗口大小 (50% 屏幕宽度)
# geometry=100%
# # 禁用默认的简陋 OSC 界面 (如果你安装了 uosc 脚本，必须保留此行；没装也不影响使用)
# osc=no
# # 禁用默认的 OSD 栏 (同上，为了配合 uosc 或保持极简)
# osd-bar=no

# [video]
# 使用高质量预设 (开启各种缩放优化)
profile=high-quality
# 使用新一代渲染引擎 (基于 libplacebo，支持更多现代特性)
vo=gpu-next
# 强制使用 Wayland 后端 (避免 XWayland 的性能损耗和模糊)
gpu-context=wayland
# 开启硬解 (硬件解码)，降低 CPU 占用
hwdec=auto-safe
# 视频同步 (防止画面撕裂/掉帧，配合 Niri 使用)
video-sync=display-resample
interpolation=yes
tscale=oversample

# [sub]
# 字幕语言优先：简中 > 繁中 > 英文
slang=zh,chi,zh-CN,zh-TW,en,eng
# 音频语言优先：日语 > 英语 > 中文 (适合看番/电影)
alang=ja,jpn,en,eng,zh,chi
# 字幕字体大小与样式 (防止默认字幕太丑)
sub-auto=fuzzy
sub-font-size=48
# 强制外挂字幕如果不包含样式，则使用以下样式
sub-ass-override=force

# [screenshot]
screenshot-directory=~/Pictures/Screenshots/
screenshot-format=png
screenshot-template="%F_time%P"
