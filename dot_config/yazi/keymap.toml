# [keymap.shell]
[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

# If you also using Yazi on Windows:
[[mgr.prepend_keymap]]
on   = "!"
for  = "windows"
run  = 'shell "pwsh.exe" --block'
desc = "Open pwsh here"

# [keymap.input]
[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"
