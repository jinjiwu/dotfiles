[mgr]
linemode = "size"      # size / mtime / none
show_hidden = true
show_symlink = true
scrolloff = 3

[preview]
tab_size = 2
warp = true

# [plugin.mine_ext]
[[plugin.prepend_fetchers]]
id   = "mime"
url  = "local://*"
run  = "mime-ext.local"
prio = "high"

[[plugin.prepend_fetchers]]
id   = "mime"
url  = "remote://*"
run  = "mime-ext.remote"
prio = "high"
